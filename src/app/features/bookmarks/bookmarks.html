<main class="p-6">
  <section class="max-w-6xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-gray-900">Bookmarks</h1>
        <p class="text-sm text-gray-500">Saved articles are kept here for quick access.</p>
      </div>
    </div>

    @if (displayBookmarks().length === 0) {
      <div class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-gray-500 h-screen">
        You don't have any bookmarks yet.
      </div>
    } @else {
      <div class="max-h-screen grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto">
        @for (article of displayBookmarks(); track article.id) {
          <app-article-card
            [article]="article"
            [isBookmarked]="isArticleBookmarked(article.url)"
            (articleSelected)="openArticle($event)"
            (bookmarkToggled)="onBookmarkToggle($event)"
          ></app-article-card>
        }
      </div>
    }
  </section>
</main>
