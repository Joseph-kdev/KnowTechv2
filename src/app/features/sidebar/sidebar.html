<!-- Desktop sidebar -->
<aside
  [class.w-56]="isExpanded()"
  [class.w-16]="!isExpanded()"
  class="hidden md:flex flex-col py-4 bg-white border-r border-gray-200 transition-all duration-200 overflow-hidden h-screen"
>
  <div class="flex justify-end px-3 mb-4">
    <button (click)="toggle()" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100">
      @if (isExpanded()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
        </svg>
      }
    </button>
  </div>

  <nav class="flex flex-col gap-1 px-2 flex-1">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-background-200 text-primary-400"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-gray-500 hover:bg-background-100 transition-colors"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/>
        </svg>
        @if (isExpanded()) {
          <span class="text-sm font-medium whitespace-nowrap">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="px-2 mt-auto">
    <a
      routerLink="/profile"
      routerLinkActive="bg-background-200 text-primary-400"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-background-100 transition-colors"
    >
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      @if (isExpanded()) {
        <span class="text-sm font-medium whitespace-nowrap">Profile</span>
      }
    </a>
  </div>
</aside>

<!-- Mobile bottom nav -->
<nav class="flex md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50 h-16">
  @for (item of navItems; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-background-200 text-primary-400"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }"
      class="flex flex-col items-center justify-center flex-1 gap-0.5 text-gray-400 hover:text-gray-600 transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/>
      </svg>
      <span class="text-[10px] font-medium">{{ item.label }}</span>
    </a>
  }
  <a
    routerLink="/profile"
    routerLinkActive="bg-background-200 text-primary-400"
    class="flex flex-col items-center justify-center flex-1 gap-0.5 text-gray-400 hover:text-gray-600 transition-colors"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
    <span class="text-[10px] font-medium">Profile</span>
  </a>
</nav>
